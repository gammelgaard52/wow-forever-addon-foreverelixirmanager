name: Upload approved release to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved GitHub release tag (vX.Y.Z)
        type: string
        required: true
      release_type:
        description: CurseForge release type
        type: choice
        options: [alpha, beta, release]
        default: alpha
        required: true
      approve_upload:
        description: I authorize uploading this version to CurseForge for moderation
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: curseforge-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main' && inputs.approve_upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved tag and existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/fem-release-draft.txt
          test "$(cat /tmp/fem-release-draft.txt)" = false
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate tagged source and compare published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py --tag "$RELEASE_TAG"
          python3 -m unittest discover -s tests -p 'test_*.py'
          mkdir -p published
          archive="ForeverElixirManager-${RELEASE_TAG#v}.zip"
          gh release download "$RELEASE_TAG" --pattern "$archive" --dir published
          cmp "dist/$archive" "published/$archive"
      - name: Upload once for moderation and manual release
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
          CURSEFORGE_GAME_VERSION_NAME: ${{ vars.CURSEFORGE_GAME_VERSION_NAME }}
          CURSEFORGE_GAME_VERSION_TYPE_ID: ${{ vars.CURSEFORGE_GAME_VERSION_TYPE_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/curseforge.py --approve-upload --tag "$RELEASE_TAG" --release-type "$RELEASE_TYPE" --archive "dist/ForeverElixirManager-${RELEASE_TAG#v}.zip" --changelog CHANGELOG.md
