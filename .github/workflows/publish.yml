name: Release addon (Alpha, Beta or Release)
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type on GitHub and CurseForge
        type: choice
        options: [alpha, beta, release]
        default: alpha
        required: true
      approve_release:
        description: Publish this version on GitHub and automatically on CurseForge after moderation
        type: boolean
        default: false
        required: true
permissions:
  contents: read
# Serialize approved release runs to prevent concurrent publication.
concurrency:
  group: addon-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Require an approved manual run on main
        env:
          APPROVED: ${{ inputs.approve_release }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = gammelgaard52/wow-forever-addon-foreverelixirmanager
          test "$APPROVED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and shipped changes without publishing
        id: plan
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 scripts/publish_release.py --release-type "$RELEASE_TYPE" --check
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate source, tests and installation ZIP
        env:
          ADDON_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          luac5.1 -p ForeverElixirManager/ForeverElixirManager.lua tests/addon_test.lua
          python3 scripts/validate.py --tag "v$ADDON_VERSION"
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: approved-addon-package
          path: dist/ForeverElixirManager-${{ steps.plan.outputs.version }}.zip
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.approve_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: approved-addon-package
          path: dist
      - name: Publish approved version and upload for automatic CurseForge release
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
          CURSEFORGE_GAME_VERSION_NAME: ${{ vars.CURSEFORGE_GAME_VERSION_NAME }}
          CURSEFORGE_GAME_VERSION_TYPE_ID: ${{ vars.CURSEFORGE_GAME_VERSION_TYPE_ID }}
          ADDON_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 scripts/publish_release.py --version "$ADDON_VERSION" --release-type "$RELEASE_TYPE" --approve-release
