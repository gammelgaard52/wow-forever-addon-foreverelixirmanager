name: Release WoW addon
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate source, version, tests and archive
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p ForeverElixirManager/ForeverElixirManager.lua tests/addon_test.lua
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/validate.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/validate.py
          fi
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: foreverelixirmanager-addon
          path: dist/*.zip
          if-no-files-found: error
  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: foreverelixirmanager-addon
          path: dist
      - name: Publish approved tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Pre-1.0 builds are experimental; do not advertise them as stable/latest.
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "ForeverElixirManager $GITHUB_REF_NAME" --notes-file CHANGELOG.md "${release_flags[@]}"
