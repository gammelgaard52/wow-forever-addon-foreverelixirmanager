name: Validate addon
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce the reviewed semantic version and immutable shipped content
        run: python3 scripts/release_policy.py
  version-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assess addon version without modifying it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/version_plan.py --base "$BASE_SHA" --head "$HEAD_SHA"
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: luac5.1 -p ForeverElixirManager/ForeverElixirManager.lua tests/addon_test.lua
      - name: Test addon and validate installable archive
        run: python3 scripts/validate.py
      - name: Test publication guards and packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
