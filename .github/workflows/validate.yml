name: Validate addon
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: luac5.1 -p ForeverElixirManager/ForeverElixirManager.lua tests/addon_test.lua
      - name: Test addon and validate installable archive
        run: python3 scripts/validate.py
      - name: Test publication guards and packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
